<!-- =====================================================================
     8. FOTOGALERIE – masonry, filtry, lightbox (data v poli GALLERY)
     ===================================================================== -->
<section class="section section--dark" id="fotogalerie">
  <div class="container--wide">
    <div class="gallery-head">
      <div>
        <h2 class="h2 reveal" style="--d:.08s">Cínovec <em>objektivem</em></h2>
      </div>
      <div class="chips reveal" style="--d:.16s" id="galleryFilters" role="group" aria-label="Kategorie fotografií">
        <button class="chip is-active" type="button" data-cat="all">Vše</button>
        <button class="chip" type="button" data-cat="hriste-2024">Hřiště 2024</button>
        <button class="chip" type="button" data-cat="okoli">Hřiště a okolí</button>
        <button class="chip" type="button" data-cat="turnaje">Turnaje</button>
        <button class="chip" type="button" data-cat="teambuilding">Teambuildingy</button>
        <button class="chip" type="button" data-cat="zima">Zima na Cínovci</button>
        <button class="chip" type="button" data-toast="Virtuální prohlídku 360° připravujeme.">360° prohlídka</button>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="gallery-more"><button class="btn btn--outline" type="button" id="galleryMore" hidden>Zobrazit všechny fotky</button></div>
  </div>
</section>
